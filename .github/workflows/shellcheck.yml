name: ShellCheck Lint & Test Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # GitHub has no Alpine or CentOS runners, so those distros run as containers on Ubuntu
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: alpine
            os: ubuntu-latest
            container: alpine:3.20
          - name: rocky-linux
            os: ubuntu-latest
            container: rockylinux:9
    steps:
      - name: Install ShellCheck and Bats
        shell: sh
        run: |
          if [ "$(uname)" = "Darwin" ]; then
            brew install shellcheck bats-core
          elif [ -f /etc/alpine-release ]; then
            apk add --no-cache bash git shellcheck bats
          elif [ -f /etc/rocky-release ]; then
            dnf install -y epel-release && dnf install -y git ShellCheck bats
          else
            sudo apt-get update && sudo apt-get install -y shellcheck bats
          fi
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        shell: bash
        run: |
          find . -type f -name '*.sh' -exec shellcheck --shell=bash {} +
      - name: Run Bats Tests
        shell: bash
        run: |
          bats tests/
